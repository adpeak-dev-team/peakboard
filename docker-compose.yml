services:
  # mysql 은 원격 DB 로 이관되어 컨테이너로 띄우지 않음.
  # 볼륨 선언(mysql_data)은 하단에 유지해 기존 데이터가 삭제되지 않도록 둔다.

  backend:
    build: ./pb-back
    env_file:
      - ./pb-back/.env

  frontend:
    build: ./pb-front
    environment:
      PORT: 3030
    depends_on:
      - backend
    ports:
      - "3030:3030"

volumes:
  mysql_data:
